name: melapalayam_express
description: "Hyper-local errand, delivery, and pickup-and-drop service for Melapalayam"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.1
  shared_preferences: ^2.2.3
  share_plus: ^9.0.0
  url_launcher: ^6.2.6
  geolocator: ^11.0.0
  firebase_core: ^2.30.1
  firebase_messaging: ^14.9.1
  flutter_local_notifications: ^17.1.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - logo.png
    - logo1.png
